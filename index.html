<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>维修单查询</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#f2f3f5;overflow:hidden;-webkit-text-size-adjust:100%}
#view{position:fixed;left:0;top:0;width:100%;height:100%;border:0;display:none;
background:#f2f3f5;-webkit-overflow-scrolling:touch}
#empty{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border-radius:14px;padding:26px 22px;max-width:320px;width:100%;
text-align:center;box-shadow:0 2px 12px rgba(16,24,40,.07)}
.card .t{font-size:16px;font-weight:700;margin-bottom:8px}
.card .s{font-size:13px;color:#6b7280;line-height:1.7}
#tip{position:fixed;left:0;right:0;bottom:0;z-index:9;display:none;
padding:9px 14px calc(9px + env(safe-area-inset-bottom));
background:rgba(31,111,235,.95);color:#fff;text-align:center;
font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
#tip b{font-weight:700}
@media (prefers-color-scheme:dark){
 body,#view{background:#111418}
 .card{background:#1a1e24;box-shadow:none}
 .card .t{color:#e6e8ec}
 .card .s{color:#9aa2ae}
}
</style>
</head>
<body>
<div id="empty"><div class="card">
  <div class="t">维修单查询</div>
  <div class="s">请扫描总部资产管理部发给您的<br>维修单位专属二维码</div>
</div></div>
<iframe id="view" src="about:blank" allow="clipboard-write"></iframe>
<div id="tip">如页面一直空白，请点右上角 ··· → <b>在浏览器中打开</b></div>
<script>
(function () {
  var BASE = "https://driver-dates-register-does.trycloudflare.com";
  var m = location.search.match(/[?&]u=(u-[0-9a-f]{12})/);
  if (!m) return;                       // 没有令牌 → 保留"请扫码"提示
  var f = document.getElementById('view');
  document.getElementById('empty').style.display = 'none';
  f.style.display = 'block';
  var loaded = false;
  f.onload = function () { loaded = true; };
  f.src = BASE + '/' + m[1] + '.html';
  // 5 秒还拿不到任何响应 → 提示改用外部浏览器（微信内嵌失败的兜底）
  setTimeout(function () {
    if (!loaded) document.getElementById('tip').style.display = 'block';
  }, 5000);
})();
</script>
</body>
</html>
