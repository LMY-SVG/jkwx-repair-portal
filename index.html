<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>维修单查询</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#f2f3f5;overflow:hidden;-webkit-text-size-adjust:100%}
#view{position:fixed;left:0;top:0;width:100%;height:100%;border:0;display:none;
background:#f2f3f5;-webkit-overflow-scrolling:touch}
#empty{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border-radius:14px;padding:26px 22px;max-width:320px;width:100%;
text-align:center;box-shadow:0 2px 12px rgba(16,24,40,.07)}
.card .t{font-size:16px;font-weight:700;margin-bottom:8px}
.card .s{font-size:13px;color:#6b7280;line-height:1.7}
#tip{position:fixed;left:0;right:0;bottom:0;z-index:9;display:none;
padding:9px 14px calc(9px + env(safe-area-inset-bottom));
background:rgba(31,111,235,.95);color:#fff;text-align:center;
font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
#tip b{font-weight:700}
/* —— 后台搜索 —— */
#search{position:fixed;inset:0;display:none;flex-direction:column;background:#f2f3f5;
font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
#search header{padding:calc(12px + env(safe-area-inset-top)) 16px 10px;background:#fff;
box-shadow:0 1px 6px rgba(16,24,40,.06);flex:none}
#search header .hd{font-size:16px;font-weight:700;margin-bottom:10px}
.swrap{position:relative}
#q{width:100%;padding:11px 40px 11px 14px;border:1px solid #d8dce2;border-radius:10px;
font-size:15px;outline:none;background:#f6f7f9;-webkit-appearance:none}
#q:focus{border-color:#1f6feb;background:#fff}
#clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;
border:0;background:none;color:#9aa2ae;font-size:18px;display:none}
#list{flex:1;overflow-y:auto;padding:10px 14px calc(16px + env(safe-area-inset-bottom))}
.it{background:#fff;border-radius:12px;padding:13px 15px;margin-bottom:9px;
box-shadow:0 1px 6px rgba(16,24,40,.05);cursor:pointer;transition:transform .08s}
.it:active{transform:scale(.985)}
.it .nm{font-size:14px;font-weight:600;color:#1f2329;line-height:1.55;word-break:break-all}
.it .nm mark{background:#ffe58f;color:inherit;padding:0 1px;border-radius:2px}
.it .st{margin-top:5px;font-size:12px;color:#6b7280}
.it .st b{color:#d4380d;font-weight:600}
#nores{display:none;text-align:center;color:#6b7280;font-size:13px;padding:48px 0;line-height:1.8}
#loadfail{display:none;text-align:center;color:#6b7280;font-size:13px;padding:48px 20px;line-height:1.8}
@media (prefers-color-scheme:dark){
 body,#view,#search{background:#111418}
 .card{background:#1a1e24;box-shadow:none}
 .card .t{color:#e6e8ec}
 .card .s{color:#9aa2ae}
 #search header{background:#1a1e24;box-shadow:none}
 #search header .hd{color:#e6e8ec}
 #q{background:#242a32;border-color:#39414c;color:#e6e8ec}
 #q:focus{background:#1f242b;border-color:#388bfd}
 #list .it{background:#1a1e24;box-shadow:none}
 .it .nm{color:#e6e8ec}
 .it .st{color:#9aa2ae}
 #nores,#loadfail{color:#9aa2ae}
}
</style>
</head>
<body>
<div id="empty"><div class="card">
  <div class="t">维修单查询</div>
  <div class="s">请扫描总部资产管理部发给您的<br>维修单位专属二维码</div>
</div></div>
<iframe id="view" src="about:blank" allow="clipboard-write"></iframe>

<div id="search">
  <header>
    <div class="hd">维修单位查询</div>
    <div class="swrap">
      <input id="q" type="search" placeholder="输入校区关键字，如：电子路 / 新教师学院" autocomplete="off">
      <button id="clr" aria-label="清空">×</button>
    </div>
  </header>
  <div id="list"></div>
  <div id="nores">没有匹配的单位<br>试试更短的关键字，如只输「电子路」</div>
  <div id="loadfail">数据加载失败，请稍后重试<br>或点右上角 ··· → 在浏览器中打开</div>
</div>

<div id="tip">如页面一直空白，请点右上角 ··· → <b>在浏览器中打开</b></div>
<script>
(function () {
  var BASE = "";
  var m = location.search.match(/[?&]u=(u-[0-9a-f]{12})/);
  if (!m) { runSearch(); return; }   // 没有令牌 → 显示后台搜索页
  // 同域模式（BASE 为空）：单位页就在本站根下，直接跳。
  // 同域不产生跨域导航，微信不会弹"无法确认是否安全"的拦截页。
  if (!BASE) { location.replace(m[1] + '.html'); return; }
  var f = document.getElementById('view');
  document.getElementById('empty').style.display = 'none';
  f.style.display = 'block';
  var loaded = false;
  f.onload = function () { loaded = true; };
  f.src = BASE + '/' + m[1] + '.html';
  // 5 秒还拿不到任何响应 → 提示改用外部浏览器（微信内嵌失败的兜底）
  setTimeout(function () {
    if (!loaded) document.getElementById('tip').style.display = 'block';
  }, 5000);

  /* ============ 后台搜索（无令牌时） ============ */
  function runSearch() {
    var box = document.getElementById('search');
    var q = document.getElementById('q'), clr = document.getElementById('clr');
    var list = document.getElementById('list');
    var nores = document.getElementById('nores'), fail = document.getElementById('loadfail');
    var units = [];
    box.style.display = 'flex';
    fetch('data/search.json', {cache: 'no-store'}).then(function (r) {
      if (!r.ok) throw 0; return r.json();
    }).then(function (d) {
      units = d.units || [];
      render('');
    }).catch(function () {
      list.style.display = 'none';
      fail.style.display = 'block';
    });
    // 多关键字：空格分开，全部命中才算匹配（如「新都 电子路」）
    function hit(name, kws) {
      for (var i = 0; i < kws.length; i++) if (name.indexOf(kws[i]) < 0) return false;
      return true;
    }
    function esc(s) {
      return s.replace(/[&<>"]/g, function (c) {
        return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c];
      });
    }
    function hl(name, kws) {
      if (!kws.length) return esc(name);
      var re = new RegExp('(' + kws.map(function (k) {
        return k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      }).join('|') + ')', 'g');
      return esc(name).replace(re, '<mark>$1</mark>');
    }
    function render(txt) {
      var kws = (txt || '').trim().toLowerCase().split(/\s+/).filter(Boolean);
      var rows = units.filter(function (u) { return hit(u.name, kws); });
      clr.style.display = txt ? 'block' : 'none';
      fail.style.display = 'none';
      if (!rows.length) {
        list.innerHTML = '';
        nores.style.display = 'block';
        return;
      }
      nores.style.display = 'none';
      list.innerHTML = rows.map(function (u) {
        var st = '共 <b>' + u.total + '</b> 单' + (u.pending ? ' · 待维修 <b>' + u.pending + '</b>' : '');
        return '<div class="it" data-slug="' + esc(u.slug) + '.html">' +
               '<div class="nm">' + hl(u.name, kws) + '</div>' +
               '<div class="st">' + st + '</div></div>';
      }).join('');
    }
    q.addEventListener('input', function () { render(q.value); });
    clr.addEventListener('click', function () { q.value = ''; render(''); q.focus(); });
    list.addEventListener('click', function (e) {
      var it = e.target.closest('.it');
      if (it) location.href = it.getAttribute('data-slug');
    });
  }
})();
</script>
</body>
</html>
