name: repair-sync

# 钉钉 AI 表格数据由本机 local_push.py 通过 repository_dispatch 推进来。
# 触发方式：POST /repos/LMY-SVG/jkwx-repair-portal/dispatches
#          {"event_type":"dingtalk-sync","client_payload":{"data":"<base64(gzip(json))>"}}
#
# Pages artifact 部署：公开仓库 Actions 免费不限次、部署产物不进仓库
# （所以单位页的令牌仍然不可枚举）、与二维码同域（微信不拦跨域导航）。
#
# 仓库是公开的，Actions 日志任何人可见：
#   只允许打印 rev / 单量 / 文件数，**绝不 echo 任何业务数据**。
#
# 2026-11-25 部署连挂 4 次：github-script 能查到 artifact（同一个 run、
# 未过期），0.4 秒后 deploy-pages 却报 "Found 0 artifact(s)"。属于 GitHub
# artifact 索引的副本一致性延迟（一次查询命中新副本、下一次命中旧副本）。
# 本版三道保险：
#   1) 上传后连续 5 次都查到 artifact 才部署（约 15 秒，等副本同步）；
#   2) deploy-pages 失败后间隔 25s / 40s 自动重试，最多 3 次；
#   3) 清理旧产物挪到部署之后，删除动作不干扰本轮产物查询。
# 另外 local_push.py 加了 30 分钟心跳重推，即使整轮全挂也能自愈。

on:
  repository_dispatch:
    types: [dingtalk-sync]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write          # 删旧 artifact 需要

concurrency:
  group: repair-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: https://lmy-svg.github.io/jkwx-repair-portal/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成整站
        env:
          PAYLOAD_B64: ${{ github.event.client_payload.data }}
          PORTAL_SALT: ${{ secrets.PORTAL_SALT }}
          SITE_OUT_DIR: _site
        run: |
          if [ -z "$PAYLOAD_B64" ]; then
            echo "没有 payload（手动触发时正常）——跳过，不覆盖线上站点"
            exit 0
          fi
          python -m pip install --quiet qrcode pillow
          python cloud_sync.py

      # 数据没变时 cloud_sync 不写 _site，这里就不部署
      - name: 检查是否需要部署
        id: chk
        run: |
          if [ -f _site/index.html ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
          else
            echo "go=no" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.chk.outputs.go == 'yes'
        uses: actions/configure-pages@v5

      - if: steps.chk.outputs.go == 'yes'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1

      # 关键：等 artifact 索引在多个副本间同步稳定，再让 deploy-pages 去取。
      # 只查一次不够——曾出现 script 查到、0.4 秒后 deploy-pages 查不到。
      - if: steps.chk.outputs.go == 'yes'
        name: 等待产物索引就绪
        uses: actions/github-script@v7
        with:
          script: |
            let ok = 0, lastId = 0;
            for (let i = 0; i < 20; i++) {
              try {
                const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                  owner: context.repo.owner, repo: context.repo.repo,
                  run_id: context.runId, per_page: 100
                });
                const hit = (data.artifacts || []).find(
                  a => a.name === 'github-pages' && !a.expired);
                if (hit) { ok += 1; lastId = hit.id; } else { ok = 0; }
                core.info(`artifact check ${i + 1}: stable=${ok}/5 id=${lastId}`);
              } catch (e) {
                ok = 0;
                core.warning(`list artifacts: ${e.message}`);
              }
              if (ok >= 5) break;
              await new Promise(r => setTimeout(r, 3000));
            }
            core.info(ok >= 5 ? `artifact index stable, id=${lastId}`
                              : 'artifact 索引未稳定，仍继续尝试部署');

      - if: steps.chk.outputs.go == 'yes'
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - if: steps.chk.outputs.go == 'yes' && steps.deploy1.outcome == 'failure'
        name: 部署重试前的等待
        run: sleep 25

      - if: steps.chk.outputs.go == 'yes' && steps.deploy1.outcome == 'failure'
        id: deploy2
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - if: steps.chk.outputs.go == 'yes' && steps.deploy2.outcome == 'failure'
        name: 部署二次重试前的等待
        run: sleep 40

      - if: steps.chk.outputs.go == 'yes' && steps.deploy2.outcome == 'failure'
        id: deploy3
        uses: actions/deploy-pages@v4

      # 清理放最后：删除动作不会干扰本轮 deploy-pages 的产物查询。
      - name: 清理旧产物（防 500MB 配额打满）
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            let all = [], page = 1;
            while (page <= 10) {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                owner, repo, per_page: 100, page
              });
              if (!data.artifacts.length) break;
              all = all.concat(data.artifacts);
              page += 1;
            }
            all.sort((a, b) => b.id - a.id);
            const keep = new Set(all.slice(0, 5).map(a => a.id));
            const cutoff = Date.now() - 6 * 3600 * 1000;
            const targets = all.filter(a => !keep.has(a.id) &&
              new Date(a.created_at).getTime() < cutoff);
            core.info(`artifacts=${all.length} to_delete=${targets.length}`);
            for (let i = 0; i < targets.length; i += 10) {
              await Promise.all(targets.slice(i, i + 10).map(a =>
                github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id })
                  .catch(e => core.warning(`del ${a.id}: ${e.message}`))));
            }
            core.info('cleanup done');
